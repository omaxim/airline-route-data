name: Update airline route data
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # flightsfrom sits behind Cloudflare, which blocks datacenter IPs (incl.
      # GitHub runners). Route the runner through a home WireGuard tunnel so it
      # exits from a residential IP that Cloudflare waves through. The whole
      # client config is stored in the WIREGUARD_CONF repo secret.
      - name: Connect home WireGuard (residential exit IP)
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          # write config, drop DNS= lines (avoids needing resolvconf on runner)
          printf '%s\n' "${{ secrets.WIREGUARD_CONF }}" \
            | grep -vi '^[[:space:]]*DNS' | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          # The tunnel routes IPv4 only (AllowedIPs 0.0.0.0/0). GitHub runners
          # have native IPv6, so traffic can leak out the runner's native
          # (datacenter) IPv6 and get Cloudflare-blocked. Disable IPv6 so ALL
          # traffic (incl. the scraper's) is forced through the v4 tunnel.
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 >/dev/null
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 >/dev/null
          sudo wg-quick up wg0
          sleep 3
          hs=$(sudo wg show wg0 latest-handshakes | awk '{print $2}' | head -1)
          echo "WireGuard handshake: $([ "${hs:-0}" -gt 0 ] && echo OK || echo NONE)"
          # ISP name only (no IP) — confirms residential vs datacenter exit.
          echo "Exit ISP: $(curl -4 -s --max-time 20 https://ipinfo.io/org || echo unknown)"
          # Real Cloudflare test: curl_cffi with Chrome's TLS fingerprint, like
          # the scraper. Plain curl is fingerprint-blocked even from a
          # residential IP, so it would be a false negative here.
          uv run --python 3.10 --with curl_cffi python -c "import sys; from curl_cffi import requests; r=requests.get('https://www.flightsfrom.com/airports', impersonate='chrome', timeout=30); print('flightsfrom via curl_cffi -> HTTP', r.status_code); sys.exit(0 if r.status_code==200 else 1)"

      - name: Scrape and commit
        run: |
          uv run --python 3.10 --with-requirements requirements.txt -- \
            python -u scrape_airline_routes.py

          git config --global user.email "bot@jonty.co.uk"
          git config --global user.name "Airline Route Update GHA"
          git add airline_routes.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatic airline route update"
          fi

      - name: Disconnect WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
