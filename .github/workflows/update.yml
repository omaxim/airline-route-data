name: Update airline route data
# Daily: one date's departures board for every airport (days/<date>.json.gz, a week
# ahead). Sundays: the latest 7 consecutive days assembled into airline_routes.json,
# the weekly snapshot consumers sync. A manual run can take explicit dates (to fill
# a gap) and/or force the assembly.
on:
  schedule:
    # Four short, gentle runs a day, six hours apart: each stops at 1,500 pages or 45 minutes
    # (the site cut sessions off after ~70 min). The near-term day first, then forward dates.
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      dates:
        description: 'Dates to scrape, space separated (YYYY-MM-DD); empty = 7 days ahead'
        required: false
        default: ''
      assemble:
        description: 'Assemble airline_routes.json from the latest 7 days after scraping'
        type: boolean
        default: false
      forward:
        description: 'Forward schedule dates to refresh this run (0 = none)'
        required: false
        default: '2'
      only:
        description: 'Test: only these airports (space separated IATA); writes a sample, commits nothing'
        required: false
        default: ''
permissions:
  contents: write        # commits, and the forward-boards release
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # flightsfrom sits behind Cloudflare, which blocks datacenter IPs (incl.
      # GitHub runners). Route the runner through a home WireGuard tunnel so it
      # exits from a residential IP. The whole client config is stored in the
      # WIREGUARD_CONF repo secret.
      - name: Connect home WireGuard (residential exit IP)
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          # Tunnel only flightsfrom.com (and the exit check), not the runner's own traffic:
          # with AllowedIPs 0.0.0.0/0 the runner's link to GitHub also went through the home
          # line, and on 12 Oct a step stayed "in progress" for 30 minutes after it had finished.
          ips=$( (getent ahostsv4 www.flightsfrom.com; getent ahostsv4 flightsfrom.com; getent ahostsv4 ipinfo.io) \
                 | awk '{print $1"/32"}' | sort -u | paste -sd, -)
          echo "Tunnelled: $ips"
          printf '%s\n' "${{ secrets.WIREGUARD_CONF }}" \
            | grep -vi '^[[:space:]]*DNS' \
            | sed -E "s#^([[:space:]]*AllowedIPs[[:space:]]*=).*#\\1 ${ips}#I" \
            | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          # IPv4-only tunnel: disable IPv6 so nothing leaks out the runner's own address.
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 >/dev/null
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 >/dev/null
          sudo wg-quick up wg0
          sleep 3
          hs=$(sudo wg show wg0 latest-handshakes | awk '{print $2}' | head -1)
          echo "WireGuard handshake: $([ "${hs:-0}" -gt 0 ] && echo OK || echo NONE)"
          echo "Exit ISP: $(curl -4 -s --max-time 20 https://ipinfo.io/org || echo unknown)"
          # os._exit: curl_cffi can leave the interpreter hanging at shutdown (12 Oct: the
          # check printed HTTP 200 and then held the step for 28 minutes)
          timeout 120 uv run --python 3.10 --with curl_cffi --with typing_extensions python -c "import os; from curl_cffi import requests; r=requests.get('https://www.flightsfrom.com/airports', impersonate='chrome', timeout=30); print('flightsfrom via curl_cffi -> HTTP', r.status_code, flush=True); os._exit(0 if r.status_code==200 else 1)"

      # ONE stream, one page at a time: the near-term day, then the forward dates due (one
      # sample week per month, ~11 months ahead, refreshed oldest first). Seven parallel
      # streams got the scraper blocked on 12 Oct 2026. Exit code 3 = the site blocked us:
      # stop at once, keep the partial file for the next run, never retry against a block.
      - name: Scrape the day and the forward dates due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN="uv run --python 3.10 --with-requirements requirements.txt -- python -u scrape_airline_routes.py"
          ONLY="${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}"
          # stop cleanly ~25 min before the job timeout, so the commit step still runs
          export SCRAPE_DEADLINE=$(( $(date +%s) + 45*60 ))
          AFTERNOON=0
          N="${{ github.event.inputs.forward }}"; [ -z "$N" ] && N=1
          [ -n "$ONLY" ] && N=0
          set +e
          rc=0
          if [ $AFTERNOON = 0 ]; then
            $RUN day ${{ github.event.inputs.dates }} $ONLY; rc=$?
            if [ $rc -eq 3 ]; then echo "::warning::Blocked by the site: stopping this run."; exit 0; fi
            [ $rc -ne 0 ] && echo "::warning::near-term day did not complete (exit $rc)"
            [ $rc -eq 4 ] && { echo "Page cap or time reached: partial kept."; exit 0; }
            # the near-term day is the priority: no forward work until it is complete
            [ $rc -ne 0 ] && exit 0
          fi
          FWD=$( [ "$N" -gt 0 ] && $RUN forward-plan $N || true )
          echo "Forward dates due: ${FWD:-none}"
          done_dates=""
          for d in $FWD; do
            # partials resume, so a forward date may start with any time left
            if [ $(( SCRAPE_DEADLINE - $(date +%s) )) -lt $(( 5*60 )) ]; then echo "No time left for $d."; break; fi
            $RUN forward-day $d; frc=$?
            [ $frc -eq 0 ] && done_dates="$done_dates $d"
            [ $frc -eq 4 ] && { echo "Page cap or time reached: partial kept."; break; }
            if [ $frc -eq 3 ]; then echo "::warning::Blocked by the site: stopping this run."; break; fi
          done
          if [ -n "$done_dates" ]; then
            gh release view forward-boards >/dev/null 2>&1 || \
              gh release create forward-boards --title "Forward schedule boards" \
                --notes "Departures boards of the forward sample weeks (replaced on every refresh). See README."
            for d in $done_dates; do gh release upload forward-boards forward_days/$d.json.gz --clobber; done
            $RUN forward-done $done_dates
          fi
          [ $rc -eq 4 ] && rc=0
          exit $rc

      - name: Assemble the week and the forward months (Sundays, or on request)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.assemble }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            RUN="uv run --python 3.10 --with-requirements requirements.txt -- python -u scrape_airline_routes.py"
            $RUN assemble || echo "::warning::weekly assembly skipped (not 7 complete consecutive days yet)"
            mkdir -p forward_days
            gh release download forward-boards --dir forward_days --pattern '*.json.gz' --clobber || true
            $RUN forward-assemble || echo "::warning::forward assembly failed"
          else
            echo "Not Sunday: no weekly assembly."
          fi

      - name: Disconnect WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Commit
        if: github.event.inputs.only == ''
        run: |
          git config --global user.email "bot@jonty.co.uk"
          git config --global user.name "Airline Route Update GHA"
          # keep three weeks of daily boards
          ls days/????-??-??.json.gz 2>/dev/null | sort | head -n -21 | xargs -r git rm -q
          # only paths that exist: `git add forward` before the first forward date failed the
          # whole step on 12 Oct and lost a saved partial day
          for p in days airline_routes.json forward; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          elif git diff --cached --name-only | grep -qx airline_routes.json; then
            git commit -m "Automatic airline route update"
          else
            git commit -m "Departures boards: $(git diff --cached --name-only | grep -o '[0-9-]\{10\}' | sort -u | tr '\n' ' ')"
          fi

      - name: Push changes
        if: github.event.inputs.only == ''
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
